[package]
name = "geomon-pdf-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
pdfcraft-ui-egui.workspace = true
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Event", "MessageEvent", "EventTarget"] }
js-sys = "0.3"

[dev-dependencies]
pdfcraft-testkit.workspace = true
pdfcraft-engine.workspace = true
pdfcraft-render.workspace = true
